<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<body>
<title>Votação SAB CIO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Poppins:wght@400;600&display=swap">
<style>
  :root{
    --bg:#212226; --card:#292A2F; --card2:#2F3036; --line:#3C3D45;
    --roxo:#A05BD1; --lima:#C3D93B; --teal:#22C1C3;
    --texto:#E4E4EA; --muted:#A3A3AE;
    color-scheme: dark;
  }
  body{
    margin:0; background:var(--bg); color:var(--texto);
    font-family:Poppins,system-ui,Segoe UI,Roboto,sans-serif;
    padding-inline:16px; padding-block:12px; min-height:96vh;
  }
  h1,h2,h3,.q{font-family:Montserrat,Poppins,sans-serif; font-weight:800; text-wrap:balance; margin:0}
  .eyebrow{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--roxo); font-weight:600}
  .eyebrow::before{content:""; display:block; width:34px; height:3px; background:var(--roxo); margin-bottom:6px}
  .muted{color:var(--muted)}
  .wrap{max-width:520px; margin:0 auto; display:flex; flex-direction:column; gap:16px}
  .telaoWrap{max-width:1220px; margin:0 auto; display:flex; flex-direction:column; gap:14px; min-height:92vh}
  .palco{flex:1; display:flex; flex-direction:column; gap:14px; justify-content:flex-start}
  .logo{font-family:Montserrat; font-weight:800; font-size:15px}
  .logo b{color:var(--roxo)}
  .card{background:var(--card); border-radius:12px; padding:16px}
  .q{font-size:clamp(19px,2.6vw,30px); line-height:1.25}
  .titulo1{font-size:clamp(26px,4vw,52px); line-height:1.1}
  .titulo2{font-size:clamp(20px,3vw,38px); color:var(--roxo)}
  .opts{display:flex; flex-direction:column; gap:10px; margin-top:4px}
  button{font:inherit; color:inherit; cursor:pointer}
  .opt{
    display:flex; align-items:center; gap:12px; text-align:left; width:100%; box-sizing:border-box;
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:13px; font-size:15px; transition:border-color .15s, background .15s;
  }
  .opt:active,.opt:hover{border-color:var(--roxo)}
  .opt.sel{border-color:var(--roxo); background:var(--card2)}
  .opt .letra{
    flex:0 0 34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--card2); border:1px solid var(--roxo); color:var(--roxo);
    font-family:Montserrat; font-weight:800;
  }
  .btn{background:var(--roxo); color:#17131c; border:0; border-radius:10px; padding:11px 16px; font-weight:600; font-size:13.5px}
  .btn[disabled]{opacity:.4; cursor:default}
  .btn.ghost{background:transparent; color:var(--texto); border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--roxo)}
  .pill{display:inline-block; border:1px solid var(--line); border-radius:999px; padding:4px 12px; font-size:12px; color:var(--muted)}
  .pill.on{border-color:var(--lima); color:var(--lima)}
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .bar{display:grid; grid-template-columns:34px 1fr 84px; gap:10px; align-items:center; margin-top:10px}
  .bar .letra{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:var(--card2);border:1px solid var(--line);color:var(--muted);font-family:Montserrat;font-weight:800;font-size:13px}
  .bar.top .letra{border-color:var(--lima);color:var(--lima)}
  .trilho{background:var(--card2); border-radius:8px; height:34px; position:relative; overflow:hidden}
  .fill{position:absolute; inset:0 auto 0 0; width:0%; background:var(--roxo); border-radius:8px; transition:width .5s ease}
  .bar.top .fill{background:var(--lima)}
  .trilho .rotulo{position:absolute; inset:0; display:flex; align-items:center; padding-inline:10px; font-size:12.5px; z-index:1;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--texto)}
  .num{font-variant-numeric:tabular-nums; text-align:right; font-weight:600; font-size:14px}
  .num small{display:block; font-weight:400; color:var(--muted); font-size:11px}
  .grade{display:grid; grid-template-columns:minmax(0,1fr) 290px; gap:16px; align-items:start}
  @media (max-width:840px){ .grade{grid-template-columns:1fr} }
  .qrbox{background:var(--card); border-radius:12px; padding:14px; display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center}
  .qrbox #qr{background:#fff; padding:9px; border-radius:8px; line-height:0}
  .qrbox .url{font-size:11.5px; color:var(--teal); word-break:break-all; user-select:all}
  .controles{display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:var(--card); border-radius:12px; padding:10px 12px}
  .controles .passo{font-variant-numeric:tabular-nums; font-size:12.5px; color:var(--muted); margin-inline:4px}
  .aviso{border:1px solid var(--teal); border-radius:10px; padding:10px 14px; font-size:13px; background:var(--card)}
  .aviso b{color:var(--teal)}
  .grid3{display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:12px}
  .grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:12px}
  .kpi{background:var(--card); border-radius:12px; padding:14px 16px; border-left:4px solid var(--roxo)}
  .kpi .valor{font-family:Montserrat; font-weight:800; font-size:clamp(20px,2.4vw,30px); color:var(--lima)}
  .kpi b{display:block; font-size:13.5px; margin-top:4px}
  .kpi span{font-size:12px; color:var(--muted)}
  .coluna{background:var(--card); border-radius:12px; padding:16px}
  .coluna h3{color:var(--roxo); font-size:16px}
  .coluna .sub{font-size:12px; color:var(--muted); margin:2px 0 10px}
  .coluna ul{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:7px; font-size:13.5px}
  .grupoT{font-size:12px; font-weight:600; letter-spacing:.06em; color:var(--roxo); text-transform:uppercase; margin-bottom:8px}
  .grupoT::before{content:""; display:inline-block; width:22px; height:3px; background:var(--roxo); margin-right:8px; vertical-align:middle}
  .passos{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px}
  .passo-c{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px}
  .passo-c b{display:block; font-size:13.5px; margin-bottom:4px}
  .passo-c span{font-size:12px; color:var(--muted)}
  .statement{border:1px solid var(--line); border-radius:12px; padding:12px 16px; font-size:14.5px; background:var(--card)}
  .statement b{color:var(--lima)}
  .fotoGrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:12px}
  .mini h3{font-size:13.5px; margin-bottom:6px}
  .mini .linha{display:grid; grid-template-columns:22px 1fr 40px; gap:8px; align-items:center; margin-top:6px; font-size:12px}
  .mini .trilho{height:18px}
  .indice{display:flex; align-items:center; gap:16px; flex-wrap:wrap}
  .indice .valor{font-family:Montserrat; font-weight:800; font-size:44px; color:var(--lima); font-variant-numeric:tabular-nums}
  .bench{border-left:3px solid var(--teal); padding-left:12px; font-size:13px; color:var(--muted); margin-top:12px}
  .bench b{color:var(--teal)}
  .rodape{font-size:11.5px; color:var(--muted); font-style:italic}
  .contador{font-variant-numeric:tabular-nums; color:var(--lima); font-weight:600}
  .headline{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
  input.pin{background:var(--card2); color:var(--texto); border:1px solid var(--line); border-radius:8px; padding:12px; font:inherit; width:100%; box-sizing:border-box}
  .check{color:var(--lima); font-family:Montserrat; font-weight:800; font-size:40px}
  ol.nove{margin:0; padding-left:22px; display:flex; flex-direction:column; gap:9px; font-size:14px}
  .radarCv{width:100%; height:min(46vh,430px); display:block}
  .glinha{display:flex; gap:10px; align-items:center; padding:5px 0; font-size:12.8px; color:var(--muted)}
  .glinha .letra{flex:0 0 26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--card2); border:1px solid var(--line); color:var(--muted); font-family:Montserrat; font-weight:800; font-size:12px}
  .glinha.on{color:var(--texto)}
  .glinha.on .letra{border-color:var(--lima); color:var(--lima)}
  .animGrid{display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:14px}
  @media (max-width:840px){ .animGrid{grid-template-columns:1fr} }
  .cv{width:100%; height:min(54vh,500px); display:block; background:var(--card); border-radius:12px}
  .logp{background:var(--card); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:8px;
    max-height:min(54vh,500px); overflow:auto}
  .logl{font-size:12.5px; border-left:3px solid var(--roxo); padding-left:10px}
  .logl.lima{border-color:var(--lima)}
  .logl.fim{border-color:var(--teal); color:var(--teal); font-weight:600}
  .qrmini{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:10px;padding:9px 13px;font-size:12px;color:var(--texto)}
  .qrmini>div{background:#fff;padding:6px;border-radius:6px;line-height:0}
  .qrmini b{display:block;font-size:11px;color:var(--roxo)}
  [hidden]{display:none!important}
  @media (prefers-reduced-motion:reduce){ .fill{transition:none} }
</style>

<div id="app"><div class="wrap"><div class="card"><p class="muted">Carregando a sessão…</p></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
"use strict";
/* ═══════════ CONFIG ═══════════
   Backend = container Docker desta pasta (Postgres + API), que também serve esta página.
   API vazia = mesma origem. Se a API não responder, a página cai sozinha em MODO DEMO. */
const CONFIG = {
  API: "",
  PIN_TELAO: "apllos2026"
};

/* ═══════════ PERGUNTAS DE VOTAÇÃO ═══════════ */
const PERGUNTAS = {
  aq: { rotulo:"Aquecimento", pergunta:"De qual setor você vem?",
    opcoes:[["A","Indústria"],["B","Varejo e consumo"],["C","Serviços financeiros"],["D","Saúde"],["E","Outro"]],
    scores:null, bench:"Aquecimento — serve para testar o QR com a sala.", gancho:"Todo mundo conseguiu votar? Então vamos ao que interessa." },
  p1: { rotulo:"Provocação 1 · Inventário", pergunta:"Quantos agentes de IA rodam hoje na sua empresa com acesso a dados reais?",
    opcoes:[["A","Sei o número exato — temos inventário formal"],["B","Tenho uma boa ideia — mas sem inventário"],["C","Honestamente, não sei"],["D","Ainda não temos agentes em produção"]],

    scores:{A:2,B:3,C:4,D:1}, bench:"Mercado: só 21% têm governança madura para agentes (Deloitte, 08/2026).",

    ganchos:{ A:"É a diferença entre governança e sorte — 82% nem saberiam onde olhar (CSA).",B:"Perceber depois custa o preço do incidente + o da auditoria que o investiga.",C:"Alerta é meio caminho: quem responde, em quanto tempo — e o agente seguiu rodando?",D:"Bloqueio com registro é o que separa os 21% — como foi construído aí?" } },

    scores:{A:1,B:2,C:3,D:4}, bench:"Custo é a 2ª causa dos 40% que vão desligar agentes até 2027 (Gartner, 05/2026).",

    opcoes:[["A","De uma plataforma governada — catálogo, qualidade, lineage"],["B","Direto de APIs e sistemas, caso a caso"],["C","De extrações e planilhas intermediárias"],["D","Não sabemos exatamente de onde"]],
    scores:{A:4,B:2,C:1,D:1}, bench:"Agente bom em cima de dado ruim só erra mais rápido — a maturidade de IA começa na estrutura de dados.",
    gancho:"Quem votou B ou C: quem responde quando o dado estiver errado?",
    ganchos:{ A:"Fundação dos 21% — e o catálogo cobre só tabelas, ou também modelos e agentes?",B:"API caso a caso: quem avisa o agente quando o contrato do dado mudar?",C:"Planilha intermediária = lineage quebrado logo no primeiro elo.",D:"Se ninguém sabe a origem, a resposta do agente é opinião com boa aparência." } },

    scores:{A:4,B:2,C:1,D:1}, bench:"Sem rastreabilidade do dado, a resposta do agente é uma opinião com boa aparência.",
    gancho:"Quem votou A: que ferramenta sustenta esse lineage?",
    ganchos:{ A:"Minutos até a fonte — a rastreabilidade que o EU AI Act exigirá do alto risco (12/2027).",B:"Dias de investigação × decisão que o agente já executou: quem chega primeiro?",C:"Descobrir pelo cliente é o caminho mais caro que existe.",D:"'Nunca descobriríamos' e a prova de tratamento da LGPD não convivem bem." } },

    opcoes:[["A","Segurança e compliance barram"],["B","Custo imprevisível — ninguém aprova"],["C","Qualidade: as respostas não são confiáveis"],["D","Falta esteira e método — cada piloto é artesanal"],["E","Adoção: as áreas de negócio não usam"],["F","Dados: a base não está pronta"]],
    scores:null, bench:"A trava campeã ganha os próximos minutos de conversa.",
    gancho:"Quem quer defender a trava que escolheu?",
    ganchos:{ A:"Segurança barra porque não desenhou o trilho — quem desenha o freio libera o acelerador.",B:"Custo imprevisível está na raiz dos 40% do Gartner — teto por caso de uso resolve.",C:"Qualidade sem eval automatizado é opinião contra opinião.",D:"Sem esteira, cada piloto custa o preço do primeiro — para sempre.",E:"Adoção vem de caso de uso puxado pela dor do negócio — nunca pela tecnologia.",F:"A IA não criou o problema de dados: só expôs a dívida que já existia." } },

    scores:{A:4,B:3,C:2,D:1}, bench:"LGPD já exige prova hoje: agente também é tratamento de dados (sanção até 2% do faturamento).",
    gancho:"Quem votou C ou D: o que falta para virar horas?",
    ganchos:{ A:"Horas = trilha automática — vocês já estão a um passo da ISO 42001.",B:"Dias hoje; auditor e ANPD vão pedir horas amanhã.",C:"Caça a prints repete o custo a cada auditoria — trilha imutável zera esse retrabalho.",D:"Sem prova de tratamento, a sanção LGPD chega a 2% do faturamento (teto R$ 50 mi)." } },
  p9: { rotulo:"Provocação 9 · Modelo", pergunta:"Quem governa a IA na sua organização hoje?",
    opcoes:[["A","Um órgão central — comitê ou CoE aprova caso a caso"],["B","Cada área cuida da sua própria IA"],["C","Híbrido — regras e plataforma centrais, execução nas áreas"],["D","Ninguém formalmente — ainda está se organizando"]],
    scores:null, bench:"O debate do momento: central × descentralizado. O consenso que emerge é FEDERAR — política e plataforma centrais, execução nos domínios; o mesmo desenho que o data mesh consagrou como governança federada.",
    gancho:"Quem opera o híbrido: onde ficou o poder de veto?",
    ganchos:{ A:"Centralização pura escala? Quantos casos por semana o comitê aguenta antes de virar a fila que todo mundo contorna?",
      B:"Descentralização sem regra comum é como nascem os 82% de shadow agents (CSA).",
      C:"O modelo que os analistas convergem: centralize o FREIO, descentralize a DIREÇÃO — quem aqui já faz isso com dados (data mesh) está a um passo.",

const NIVEIS = ["", "1 · Inicial", "2 · Repetível", "3 · Definido", "4 · Gerenciado"];

/* ═══════════ ROTEIRO SEQUENCIAL (a apresentação inteira) ═══════════ */
const SLIDES = [
  { tipo:"mecanica" },
  { tipo:"apresentador" },
  { tipo:"anim" },
  { tipo:"recados" },
  { tipo:"voto", q:"aq" },
  { tipo:"voto", q:"p1" },
  { tipo:"voto", q:"p2" },
  { tipo:"voto", q:"p3" },
  { tipo:"voto", q:"p4" },
  { tipo:"voto", q:"p5" },

  { tipo:"voto", q:"p7" },
  { tipo:"voto", q:"p8" },
  { tipo:"voto", q:"p9" },
  { tipo:"foto" },
  { tipo:"dmbok" },
  { tipo:"sintese" },
  { tipo:"custo" },
  { tipo:"nove" },
  { tipo:"cta" }
];
const NOVE = [
  "Quantos agentes rodam hoje com acesso a dados de produção — e quem responde por cada um?",
  "Nossa política de IA é executada por algum sistema — ou é um PDF?",
  "Se um agente violar uma regra de arquitetura agora, o que acontece: aviso, bloqueio ou nada?",
  "Uma aprovação humana sobrevive à proposta do agente mudar depois dela?",
  "Sabemos o custo de inferência POR caso de uso — com teto e corte?",
  "Que evidência entregamos ao auditor sobre decisões executadas por IA — em quanto tempo?",
  "Nosso contexto (código, prompts, logs) está em nuvem própria ou na do fornecedor?",

  "Se trocarmos de fornecedor de IA amanhã, o histórico e as regras vêm conosco?"
];
/* ═══════════ armazenamento: API do container ou demo local ═══════════ */
let DEMO = true;      // vira false quando a API do backend responde
let sondado = false;  // a sonda roda uma vez, no primeiro refresh
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
const api = (caminho, opts) => fetch(CONFIG.API + caminho, Object.assign(
  { cache:"no-store", headers:{ "Content-Type":"application/json" } }, opts))
  .then(r => { if (!r.ok) throw new Error("api " + r.status); return r.json(); });

const local = {
  async getSessao(){ return lsGet("vs_sessao", { idx:0, estado:"aguardando" }); },
  async setSessao(p){ const s = Object.assign(await this.getSessao(), p); lsSet("vs_sessao", s); return s; },
  async addVoto(pergunta, opcao, votante){
    const vs = lsGet("vs_votos", []);
    const i = vs.findIndex(v => v.pergunta===pergunta && v.votante===votante);
    if (i >= 0) vs[i].opcao = opcao; else vs.push({ pergunta, opcao, votante });
    lsSet("vs_votos", vs);
  },
  async getVotos(){ return lsGet("vs_votos", []); },
  async limpar(){ lsSet("vs_votos", []); }
};

function contagem(qid){
  const c = {}; let total = 0;
  for (const v of VOTOS) if (v.pergunta === qid) { c[v.opcao] = (c[v.opcao]||0)+1; total++; }
  return { c, total };
}
function mediaScore(qid){
  const q = PERGUNTAS[qid];
  if (!q || !q.scores) return null;
  const { c } = contagem(qid); let soma = 0, n = 0;
  for (const [op, qtd] of Object.entries(c)) { const s = q.scores[op]; if (s != null) { soma += s*qtd; n += qtd; } }
  return n ? soma/n : null;
}
function barras(qid, mini){
  const q = PERGUNTAS[qid];
  const { c, total } = contagem(qid);
  const max = Math.max(1, ...q.opcoes.map(([l]) => c[l]||0));
  return q.opcoes.map(([l, txt]) => {
    const n = c[l]||0, pct = total ? Math.round(100*n/total) : 0;
    const top = total > 0 && n === max;
    if (mini) return '<div class="linha"><span class="muted">'+l+'</span><div class="trilho"><div class="fill" style="width:'+pct+'%'+(top?';background:var(--lima)':'')+'"></div></div><span class="num">'+pct+'%</span></div>';
    return '<div class="bar'+(top?' top':'')+'"><span class="letra">'+l+'</span>'+
      '<div class="trilho"><div class="fill" style="width:'+pct+'%"></div><span class="rotulo">'+esc(txt)+'</span></div>'+
      '<span class="num">'+pct+'%<small>'+n+' voto'+(n===1?'':'s')+'</small></span></div>';
  }).join("");
}

const RADAR_DIMS = [
  { id:"p1", lb:"Inventário" }, { id:"p2", lb:"Política" }, { id:"p3", lb:"Violação" },
  { id:"p4", lb:"Custo" }, { id:"p5", lb:"Dados: fonte" }, { id:"p6", lb:"Lineage" },
  { id:"p8", lb:"Auditoria" }
];
function desenharRadar(){
  const cv = $("#radar");
  if (!cv) return;
  const ctx = cv.getContext("2d");
  const DPR = window.devicePixelRatio || 1;
  const r0 = cv.getBoundingClientRect();
  cv.width = Math.max(1, r0.width*DPR); cv.height = Math.max(1, r0.height*DPR);
  const cx = cv.width/2, cy = cv.height/2 + 4*DPR;
  const R = Math.min(cv.width, cv.height)/2 - 46*DPR;
  const N = RADAR_DIMS.length;
  const ang = i => -Math.PI/2 + i*2*Math.PI/N;
  const pt = (i, v) => [cx + Math.cos(ang(i))*R*(v/4), cy + Math.sin(ang(i))*R*(v/4)];
  // anéis 1..4
  for (let nivel = 1; nivel <= 4; nivel++){
    ctx.beginPath();
    for (let i = 0; i <= N; i++){ const [x,y] = pt(i%N, nivel); i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); }
    ctx.strokeStyle = nivel === 4 ? "#4A4B55" : "#3C3D45"; ctx.lineWidth = 1*DPR; ctx.stroke();
  }
  // eixos + rótulos
  ctx.font = (11*DPR)+"px Poppins, sans-serif"; ctx.textAlign = "center";
  for (let i = 0; i < N; i++){
    const [x,y] = pt(i, 4);
    ctx.strokeStyle = "#3C3D45"; ctx.lineWidth = 1*DPR;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x,y); ctx.stroke();
    const [lx,ly] = [cx + Math.cos(ang(i))*(R + 26*DPR), cy + Math.sin(ang(i))*(R + 22*DPR)];
    const m = mediaScore(RADAR_DIMS[i].id);
    ctx.fillStyle = m != null ? "#E4E4EA" : "#A3A3AE";
    ctx.fillText(RADAR_DIMS[i].lb, lx, ly);
    if (m != null){ ctx.fillStyle = "#C3D93B"; ctx.fillText(m.toFixed(1), lx, ly + 14*DPR); }
  }
  // marcas de escala no eixo vertical
  ctx.fillStyle = "#A3A3AE"; ctx.textAlign = "left";
  for (let nivel = 1; nivel <= 4; nivel++)
    ctx.fillText(String(nivel), cx + 4*DPR, cy - R*(nivel/4) + 12*DPR);
  // polígono das médias
  const vals = RADAR_DIMS.map(d => mediaScore(d.id));
  if (vals.some(v => v != null)){
    ctx.beginPath();
    for (let i = 0; i <= N; i++){ const [x,y] = pt(i%N, vals[i%N] || 0); i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); }
    ctx.closePath();
    ctx.fillStyle = "rgba(160,91,209,.22)"; ctx.fill();
    ctx.strokeStyle = "#A05BD1"; ctx.lineWidth = 2*DPR; ctx.stroke();
    for (let i = 0; i < N; i++){ if (vals[i] == null) continue;
      const [x,y] = pt(i, vals[i]);
      ctx.fillStyle = "#C3D93B"; ctx.beginPath(); ctx.arc(x, y, 4*DPR, 0, 7); ctx.fill();
    }
  } else {
    ctx.fillStyle = "#A3A3AE"; ctx.textAlign = "center";
    ctx.fillText("Ainda sem votos pontuáveis", cx, cy);
  }
}

const ANIM = { raf:0 };
const CENA = {
  nos: [

    { de:null, para:null, log:"Ruptura evitada antes de acontecer — decisão rastreável de ponta a ponta", fim:true }
  ]
};
function pararAnim(){ if (ANIM.raf) cancelAnimationFrame(ANIM.raf); ANIM.raf = 0; }
function iniciarAnim(){
  const cv = $("#cv"), logp = $("#animlog");
  if (!cv || !logp) return;
  const ctx = cv.getContext("2d");
  const DPR = window.devicePixelRatio || 1;
  const medir = () => { const r = cv.getBoundingClientRect(); cv.width = Math.max(1, r.width*DPR); cv.height = Math.max(1, r.height*DPR); };
  medir();
  const no = id => CENA.nos.find(n => n.id === id);
  const px = n => [n.x*cv.width, n.y*cv.height];
  function desenhar(pi, frac){
    ctx.clearRect(0,0,cv.width,cv.height);
    const p = pi >= 0 ? CENA.passos[pi] : null;
    for (const n of CENA.nos){ if (n.id === "orq") continue;
      const [x1,y1] = px(no("orq")), [x2,y2] = px(n);
      ctx.strokeStyle = "#3C3D45"; ctx.lineWidth = 1.2*DPR;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    }
    if (p && p.de){
      const [x1,y1] = px(no(p.de)), [x2,y2] = px(no(p.para));
      const cor = p.lima ? "#C3D93B" : "#A05BD1";
      ctx.strokeStyle = cor; ctx.lineWidth = 2.2*DPR;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      const e = Math.max(0, Math.min(1, frac));
      const t = e < .5 ? 2*e*e : 1 - Math.pow(-2*e+2, 2)/2;
      ctx.fillStyle = cor;
      ctx.beginPath(); ctx.arc(x1+(x2-x1)*t, y1+(y2-y1)*t, 5.5*DPR, 0, 7); ctx.fill();
    }
    for (const n of CENA.nos){
      const [x,y] = px(n); const r = (n.id === "orq" ? 30 : 24)*DPR;
      const ativo = p && (p.de === n.id || p.para === n.id);
      ctx.fillStyle = "#2F3036";
      ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
      ctx.lineWidth = (ativo ? 2.6 : 1.2)*DPR;
      ctx.strokeStyle = n.humano ? "#C3D93B" : (ativo ? "#A05BD1" : "#3C3D45");
      ctx.stroke();
      ctx.fillStyle = ativo ? "#E4E4EA" : "#A3A3AE";
      ctx.font = (11.5*DPR) + "px Poppins, sans-serif"; ctx.textAlign = "center";
      const partes = n.nome.split(" ");
      const l1 = partes.length > 1 ? partes.slice(0, partes.length-1).join(" ") : n.nome;
      const l2 = partes.length > 1 ? partes[partes.length-1] : "";
      ctx.fillText(l1, x, y + r + 14*DPR);
      if (l2) ctx.fillText(l2, x, y + r + 27*DPR);
    }
  }
  const addLog = p => {
    const d = document.createElement("div");
    d.className = "logl" + (p.lima ? " lima" : "") + (p.fim ? " fim" : "");
    d.textContent = p.log;
    logp.appendChild(d); logp.scrollTop = logp.scrollHeight;
  };
  if (matchMedia("(prefers-reduced-motion: reduce)").matches){
    CENA.passos.forEach(addLog); desenhar(-1, 0); return;
  }
  const DUR = 3000;
  let passo = -1, ini = performance.now();
  function frame(ts){
    const el = ts - ini;
    let np = Math.floor(el / DUR);
    if (np >= CENA.passos.length + 1){ logp.innerHTML = ""; passo = -1; ini = ts; np = 0; }
    if (np !== passo && np < CENA.passos.length){ passo = np; addLog(CENA.passos[passo]); }
    if (passo >= 0) desenhar(Math.min(passo, CENA.passos.length-1), (el - passo*DUR)/1500);
    ANIM.raf = requestAnimationFrame(frame);
  }
  ANIM.raf = requestAnimationFrame(frame);
}

      else if (SES.estado === "aberta")
        corpo = '<div class="card"><p style="font-size:15px">Votos recebidos: <span class="contador">'+total+'</span></p>'+
          '<p class="muted" style="font-size:13px">O resultado aparece quando for revelado — vote sem olhar para o vizinho.</p></div>'+
          '<div class="opts">'+q.opcoes.map(([l,t])=>'<div class="opt" style="cursor:default"><span class="letra">'+l+'</span><span>'+esc(t)+'</span></div>').join("")+'</div>';
      else
        corpo = '<div class="opts">'+q.opcoes.map(([l,t])=>'<div class="opt" style="cursor:default;opacity:.75"><span class="letra">'+l+'</span><span>'+esc(t)+'</span></div>').join("")+
          '</div><p class="muted" style="font-size:13px">Votação ainda fechada — abra quando a sala estiver pronta.</p>';
      return '<div><p class="eyebrow">'+esc(q.rotulo)+(SES.estado==="aberta"?' · VOTAÇÃO ABERTA':SES.estado==="resultado"?' · RESULTADO':'')+'</p>'+
        '<h1 class="q">'+esc(q.pergunta)+'</h1></div>'+corpo;
    },
    foto(){
      return '<div><p class="eyebrow">SÍNTESE · PARTE 1</p><h1 class="q" style="font-size:clamp(20px,2.8vw,32px)">A fotografia desta sala</h1></div>'+
        '<div class="animGrid" style="grid-template-columns:minmax(0,1fr) 380px">'+
        '<div class="card" style="padding:8px"><canvas class="radarCv" id="radar"></canvas></div>'+
        '<div style="display:flex;flex-direction:column;gap:12px">'+fotografia(true)+
        '<p class="muted" style="font-size:12px">Radar: média da sala por dimensão (escala 1–4). Detalhe pergunta a pergunta abaixo.</p></div></div>'+
        minisFoto()+
        '<p class="rodape">Números = votos reais da sessão. Índice de maturidade é leitura ilustrativa; a régua formal sai de assessment.</p>';
    },
    sintese(){
      const C = [
        ["Política executável","não declaratória",["Regra de arquitetura é verificação que RODA","O agente tenta, é bloqueado, corrige — e fica registrado","Exceção existe — com prazo e com dono","Responde às provocações 2 e 3"]],
        ["Humano no gate","por desenho, não por gargalo",["Não existe 'aprovar tudo'","Aprovação amarrada à versão EXATA da proposta — plano, decisão ou código","A proposta mudou depois? A aprovação caduca sozinha","Vale igual para transferir um lote ou promover um sistema"]],
        ["Dados governados na base","o agente herda a maturidade do dado",["Catálogo, qualidade e lineage ANTES do agente","Resposta errada rastreia até a origem em minutos","Plataforma governada, não planilha intermediária","Responde às provocações 5 e 6"]],
        ["Soberania radical","o contexto não sai de casa",["Código, prompts e evidência na nuvem DO CLIENTE","Custo por caso de uso, com teto — o CFO enxerga","Trilha imutável: quem, o quê, com que regra, a que custo","Responde às provocações 1 e 4"]]
      ];
      return '<div><p class="eyebrow">SÍNTESE · O QUE FAZER</p><h1 class="q" style="font-size:clamp(20px,2.8vw,32px)">O que a sala disse — e o que os 21% fazem diferente</h1></div>'+
        '<div class="grid3">'+C.map(([t,s,b])=>'<div class="coluna"><h3>'+t+'</h3><p class="sub">'+s+'</p><ul>'+b.map(x=>'<li>'+x+'</li>').join("")+'</ul></div>').join("")+'</div>'+
        '<div class="statement">E sim — <b>temos um case de governança aplicando essa lente</b>; quem quiser ver como foi, nos encontre no intervalo.</div>';
    },
    dmbok(){
      const A = [
        ["Governança de Dados","política com dono, papel e regra que executa — o centro da roda","P2 · P3"],
        ["Qualidade de Dados","eval e limiar de release: resposta piorou, release não sai","P7-C"],
        ["Metadados & Lineage","rastrear a resposta do agente até a fonte, em minutos","P6"],
        ["Arquitetura de Dados","plataforma governada como fundação — não planilha intermediária","P5"],
        ["Segurança de Dados","escopo mínimo por agente; dado pessoal com prova (LGPD)","P1 · P8"],
        ["Integração & Interop.","agente consome contrato de dado — nunca o atalho","P5 · P6"]
      ];
      return '<div><p class="eyebrow">O FECHAMENTO</p>'+
        '<h1 class="q" style="font-size:clamp(20px,2.8vw,32px)">Nada do que votamos hoje é novidade — chama-se governança de dados</h1>'+
        '<p class="muted" style="font-size:13.5px;max-width:76ch">O DAMA-DMBOK organiza essa disciplina há duas décadas — e sobreviveu a warehouse, big data, lake e mesh porque governa <b style="color:var(--texto)">disciplinas, não ferramentas</b>. A ferramenta de IA muda a cada seis meses; as invariantes (escopo, gate humano, custo, evidência) não mudam. Agentes não pedem um governo novo: pedem estender o que o DMBOK já ensina a decisões que acontecem em segundos, por software.</p></div>'+
        '<div class="grid3">'+A.map(([a,d,p]) =>
          '<div class="coluna" style="padding:14px"><h3 style="font-size:14px">'+a+'</h3>'+
          '<p style="font-size:12.8px;margin:6px 0 8px">'+d+'</p>'+
          '<span class="pill" style="font-size:10.5px">na sessão de hoje: '+p+'</span></div>').join("")+'</div>'+
        '<div class="statement">Quem já tem o DMBOK na casa está mais perto do que imagina — <b>falta projetá-lo sobre os agentes</b>. É disso que trata o próximo quadro.</div>'+
        '<p class="rodape">DAMA-DMBOK® é marca da DAMA International — usada aqui como referência de mercado, sem endosso.</p>';
    },
    custo(){
      return '<div style="margin-block:auto;display:flex;flex-direction:column;gap:16px;max-width:88ch">'+
        '<p class="eyebrow">ANTES DE ENCERRAR · TRÊS PERGUNTAS DE CUSTO</p>'+
        '<h2 class="q" style="font-size:clamp(19px,2.4vw,28px);color:var(--muted)">Quanto custa um código errado em produção?</h2>'+
        '<h2 class="q" style="font-size:clamp(23px,3.1vw,36px)">Quanto custa uma regra errada — executada mil vezes por dia?</h2>'+
        '<h2 class="q" style="font-size:clamp(27px,3.8vw,44px);color:var(--roxo)">E uma vulnerabilidade que um agente abriu — e ninguém viu?</h2>'+
        '<div class="statement" style="margin-top:8px">A IA deu a todos a POC em horas e o desenvolvimento em dias. <b>O que ela não barateou foi o erro.</b> Governança é o que permite usar essa velocidade — e resolver problemas <b>sem dano</b>.</div></div>';
    },
    nove(){
      return '<div><p class="eyebrow">PARA LEVAR PARA O COMITÊ</p><h1 class="q" style="font-size:clamp(20px,2.8vw,32px)">Nove perguntas que testam qualquer programa — o nosso incluído</h1></div>'+
        '<div class="card"><ol class="nove">'+NOVE.map(p=>'<li>'+p+'</li>').join("")+'</ol></div>'+
        '<div class="statement"><b>O teste honesto:</b> quem não aguentar respondê-las não deveria estar no seu shortlist. As perguntas estão agora no celular de vocês.</div>';
    },
    cta(){
      const P = [["A régua na sua empresa",["Assessment das 8 dimensões","Inventário de agentes + gaps priorizados","Entregável: régua + roadmap executivo"]],
        ["O trilho no seu contexto",["Sessão de desenho com arquitetura e segurança","O ciclo do card no SEU processo e nuvem","Entregável: blueprint de aderência"]],
        ["Um caso de uso na esteira",["Piloto governado de ponta a ponta","Caso real, custo medido, evidência desde o dia 1","Entregável: caso em produção + trilho reutilizável"]]];
      return '<div><p class="eyebrow">TRÊS CONVERSAS PARA OS INTERVALOS</p><h1 class="q" style="font-size:clamp(20px,2.8vw,32px)">Uma das nove perguntas sem resposta? Nos encontre no intervalo.</h1></div>'+
        '<div class="grid3">'+P.map(([t,b])=>'<div class="coluna"><h3 style="font-size:15px">'+t+'</h3><ul>'+b.map(x=>'<li>'+x+'</li>').join("")+'</ul></div>').join("")+'</div>'+
        '<div class="statement"><b>www.apllos.com</b> · o material da sessão — as nove perguntas e os números com fonte — está agora no celular de quem escaneou o QR. Um print e é seu.</div>';
    }
  };
  return T[sl.tipo]();
}

/* ═══════════ conteúdo no CELULAR — o QR serve SÓ para votar ═══════════ */
function foneSlide(sl){
  if (sl.tipo === "voto" && SES.estado === "aberta") {
    const q = PERGUNTAS[sl.q];
    const votei = meusVotos[sl.q];
    return '<div><p class="eyebrow">'+esc(q.rotulo)+'</p><h2 class="q">'+esc(q.pergunta)+'</h2></div>'+
      '<div class="opts">'+q.opcoes.map(([l,t])=>'<button class="opt'+(votei===l?' sel':'')+'" data-q="'+sl.q+'" data-op="'+l+'"><span class="letra">'+l+'</span><span>'+esc(t)+'</span></button>').join("")+'</div>'+
      (votei ? '<p class="pill on">Voto registrado: '+votei+' — dá para mudar enquanto estiver aberta.</p>'
             : '<p class="pill">Toque numa opção para votar — anônimo.</p>');
  }
  if (sl.tipo === "voto" && SES.estado === "resultado") {
    const votei = meusVotos[sl.q];
    return '<div class="card"><p class="eyebrow">'+esc(PERGUNTAS[sl.q].rotulo)+'</p><span class="check">✓</span>'+
      '<h2 style="font-size:19px">Votação encerrada.</h2>'+
      '<p class="muted" style="font-size:13.5px">O resultado está no telão'+(votei ? ' — seu voto foi '+votei : '')+'. A próxima pergunta abre sozinha aqui.</p></div>';
  }
  if (sl.tipo === "cta"){
    const FONTES = [
      "40% vão desligar/rebaixar agentes até 2027 — Gartner, 05/2026",
      "82% têm agentes que a TI desconhece — Cloud Security Alliance, 04/2026",
      "21% com governança madura; 74% planejam em 2 anos — Deloitte, 08/2026",
      "Sanção LGPD: até 2% do faturamento, teto R$ 50 mi por infração — ANPD",
      "EU AI Act: obrigações de alto risco a partir de 12/2027",
      "ISO/IEC 42001: sistema de gestão de IA, já certificável"
    ];
    return '<div class="card"><p class="eyebrow">OBRIGADO — O MATERIAL É SEU</p><span class="check">✓</span>'+
      '<h2 style="font-size:19px">Tire um print destas duas listas.</h2>'+
      '<p style="font-size:14px;margin:6px 0 0"><b>www.apllos.com</b> · nos encontre no intervalo.</p></div>'+
      '<div class="card"><p class="eyebrow" style="font-size:10px">AS NOVE PERGUNTAS PARA O SEU COMITÊ</p>'+
      '<ol class="nove" style="font-size:12.5px">'+NOVE.map(p=>'<li>'+p+'</li>').join("")+'</ol></div>'+
      '<div class="card"><p class="eyebrow" style="font-size:10px">OS NÚMEROS DA SESSÃO, COM FONTE</p>'+
      '<ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:12.5px">'+
      FONTES.map(f=>'<li>'+f+'</li>').join("")+'</ul></div>';
  }
  return '<div class="card"><p class="eyebrow">Aguarde</p><h2 style="font-size:19px">A próxima votação abre aqui sozinha.</h2>'+
    '<p class="muted" style="font-size:13.5px">Mantenha esta página aberta e acompanhe o telão.</p></div>'+
    '<p style="text-align:right"><a href="#telao" style="color:var(--muted);font-size:11.5px;text-decoration:none">Sou o facilitador →</a></p>';
}

/* ═══════════ VISÃO PARTICIPANTE ═══════════ */
function vistaVotante(){
  const sl = slideAtual();
  app.innerHTML = '<div class="wrap">'+
    '<div class="headline"><span class="logo">Apllos<b>.</b></span><span class="pill">SAB CIO 2026 · voto anônimo</span></div>'+
    (DEMO ? '<div class="aviso"><b>MODO DEMO</b> — backend fora do ar: os votos ficam só neste navegador.</div>' : "")+
    foneSlide(sl)+'</div>';
  app.querySelectorAll(".opt[data-op]").forEach(b => b.addEventListener("click", async () => {
    const qid = b.dataset.q, op = b.dataset.op;
    meusVotos[qid] = op; lsSet("vs_meus", meusVotos);
    ultimaAssinatura = ""; render();
    try { await store.addVoto(qid, op, VOTANTE); } catch(e){}
  }));
}

/* ═══════════ VISÃO TELÃO ═══════════ */
let pinOk = false;
function vistaTelao(){
  if (!pinOk) {
    app.innerHTML = '<div class="wrap"><div class="headline"><span class="logo">Apllos<b>.</b></span></div>'+
      '<div class="card"><p class="eyebrow">Modo telão</p><h2 style="font-size:19px">Chave do facilitador</h2>'+
      '<div style="display:flex;gap:8px;margin-top:10px"><input class="pin" id="pin" type="password" autocomplete="off">'+
      '<button class="btn" id="entrar">Entrar</button></div><p class="muted" id="pinerro" style="font-size:12px"></p></div></div>';
    $("#entrar").addEventListener("click", () => {
      if ($("#pin").value === CONFIG.PIN_TELAO) { pinOk = true; ultimaAssinatura=""; render(); }
      else $("#pinerro").textContent = "Chave incorreta.";
    });
    $("#pin").addEventListener("keydown", e => { if (e.key === "Enter") $("#entrar").click(); });
    return;
  }
  const sl = slideAtual();
  const ehVoto = sl.tipo === "voto";
  const mostraQR = ehVoto || sl.tipo === "mecanica";
  const urlVoto = location.origin + location.pathname + location.search;
  const palco = '<div class="palco">'+telaoSlide(sl)+'</div>';
  const lateral = mostraQR ?
    '<div class="qrbox"><div id="qr"></div><b style="font-size:13.5px">Acompanhe e vote pelo celular</b>'+
    '<span class="url">'+esc(urlVoto)+'</span><span class="muted" style="font-size:11px">1 voto por pessoa · anônimo</span></div>' : "";
  app.innerHTML = '<div class="telaoWrap">'+
    '<div class="headline"><span class="logo" style="font-size:18px">Apllos<b>.</b></span>'+
    '<span class="pill">SAB CIO 2026 · governança de IA agêntica</span></div>'+
    (DEMO ? '<div class="aviso"><b>MODO DEMO</b> — backend fora do ar: votos simulados neste navegador. Outra aba sem #telao = participante.</div>' : "")+
    (mostraQR ? '<div class="grade">'+palco+'<div>'+lateral+'</div></div>' : palco)+
    '<div class="controles">'+
    '<button class="btn ghost" id="ant">←</button>'+
    '<span class="passo">'+(SES.idx+1)+' / '+SLIDES.length+'</span>'+
    '<button class="btn ghost" id="prox">→</button>'+
    (ehVoto ? '<button class="btn" id="abrir"'+(SES.estado==="aberta"?" disabled":"")+'>Abrir votação</button>'+
              '<button class="btn ghost" id="revelar"'+(SES.estado==="resultado"?" disabled":"")+'>Revelar resultado</button>' : "")+
    (DEMO && ehVoto ? '<button class="btn ghost" id="simular">Simular 25 votos</button>' : "")+
    '<button class="btn ghost" id="zerar" style="margin-left:auto">Zerar votos</button></div></div>';
  if (mostraQR) { try { new QRCode($("#qr"), { text:urlVoto, width:170, height:170, colorDark:"#212226", colorLight:"#ffffff" }); } catch(e){} }
  pararAnim();
  if (sl.tipo === "anim") iniciarAnim();
  if (sl.tipo === "apresentador"){
    const QOPT = { width:96, height:96, colorDark:"#212226", colorLight:"#ffffff" };
    try { new QRCode($("#qr-site"), Object.assign({ text:"https://www.apllos.com.br" }, QOPT)); } catch(e){}
    try { new QRCode($("#qr-zap"), Object.assign({ text:"https://wa.me/5511970441112" }, QOPT)); } catch(e){}
  }
  if (sl.tipo === "foto") desenharRadar();
  const mudar = async p => { await store.setSessao(p); ultimaAssinatura=""; await refresh(); };
  $("#ant").addEventListener("click", () => mudar({ idx:Math.max(0, SES.idx-1), estado:"aguardando" }));
  $("#prox").addEventListener("click", () => mudar({ idx:Math.min(SLIDES.length-1, SES.idx+1), estado:"aguardando" }));
  if (ehVoto) {
    $("#abrir").addEventListener("click", () => mudar({ estado:"aberta" }));
    $("#revelar").addEventListener("click", () => mudar({ estado:"resultado" }));
    const sim = $("#simular");
    if (sim) sim.addEventListener("click", async () => {
      const q = PERGUNTAS[sl.q];
      for (let i=0;i<25;i++){
        const ops = q.opcoes.map(o=>o[0]);
        const op = ops[Math.min(ops.length-1, Math.floor(Math.pow(Math.random(),1.4)*ops.length))];
        await store.addVoto(sl.q, op, "demo"+i+Math.random().toString(36).slice(2,6));
      }
      ultimaAssinatura=""; await refresh();
    });
  }
  $("#zerar").addEventListener("click", async () => { await store.limpar(); ultimaAssinatura=""; await refresh(); });
  if (navigator.wakeLock && !vistaTelao._wl) { navigator.wakeLock.request("screen").then(w=>{vistaTelao._wl=w;}).catch(()=>{}); }
}
window.addEventListener("keydown", async e => {
  if (!TELAO || !pinOk) return;
  if (e.key === "ArrowRight") { await store.setSessao({ idx:Math.min(SLIDES.length-1, SES.idx+1), estado:"aguardando" }); ultimaAssinatura=""; refresh(); }
  if (e.key === "ArrowLeft")  { await store.setSessao({ idx:Math.max(0, SES.idx-1), estado:"aguardando" }); ultimaAssinatura=""; refresh(); }
  if (e.key === "Enter" && slideAtual().tipo === "voto") {
    await store.setSessao({ estado: SES.estado === "aberta" ? "resultado" : "aberta" }); ultimaAssinatura=""; refresh();
  }
});

/* ═══════════ loop de sincronização ═══════════ */
function render(){ TELAO ? vistaTelao() : vistaVotante(); }
async function refresh(){
  if (!sondado) await sondarAPI();
  try {
    SES = await store.getSessao();
    VOTOS = await store.getVotos();
  } catch(e){}
  if (typeof SES.idx !== "number") SES.idx = 0;
  const sl = slideAtual();
  const relevante = (sl.tipo === "voto" && SES.estado !== "aguardando") || sl.tipo === "foto";
  const assin = JSON.stringify([SES, TELAO && !pinOk, relevante ? VOTOS : 0]);
  if (assin !== ultimaAssinatura) { ultimaAssinatura = assin; render(); }
}
refresh();
setInterval(refresh, 2500);
window.addEventListener("storage", refresh);
</script>
